<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>台股前100大篩選器</title><style>
body{font-family:system-ui,"Noto Sans TC",sans-serif;margin:0;padding:16px;background:#f6f7f9;color:#222}
h1{font-size:1.4em;margin:0 0 4px}.meta{color:#666;font-size:.9em;margin-bottom:12px}
.btns button{margin:0 6px 8px 0;padding:6px 12px;border:1px solid #ccc;border-radius:16px;background:#fff;cursor:pointer}
.btns button.on{background:#1f6feb;color:#fff;border-color:#1f6feb}
table{border-collapse:collapse;width:100%;background:#fff;font-size:.92em}th,td{padding:6px 8px;border-bottom:1px solid #eee;text-align:right}
th{background:#fafafa;cursor:pointer;position:sticky;top:0}td:nth-child(1),td:nth-child(2),td:last-child{text-align:left}
.up{color:#d1242f}.dn{color:#1a7f37}tr.hit{background:#fff8e1}.tag{background:#ffe08a;border-radius:8px;padding:1px 6px;margin-right:3px;font-size:.85em}
</style></head><body><h1>台股市值前100大 · 漲跌幅篩選</h1>
<div class="meta" id="meta">載入中…</div>
<div class="btns"><button data-f="all" class="on">全部</button><button data-f="any">符合任一條件</button><button data-f="當日±5%">當日漲跌幅 &gt; ±5%</button><button data-f="5日±10%">近5日累積 &gt; ±10%</button></div>
<table><thead><tr><th data-k="code">代號</th><th data-k="name">名稱</th><th data-k="mcap_yi">市值(億)</th><th data-k="close">收盤價</th><th data-k="chg1">當日漲跌%</th><th data-k="chg5">5日累積%</th><th>符合條件</th></tr></thead><tbody id="tb"></tbody></table>
<p class="meta">資料來源：臺灣證券交易所 OpenAPI（市值排名）、Yahoo Finance（收盤價歷史）。台股紅漲綠跌。僅供參考，非投資建議。</p>
<script>
let D,f="all",k="mcap_yi",asc=false;
const c=v=>v==null?"—":`<span class="${v>0?"up":v<0?"dn":""}">${v>0?"+":""}${v.toFixed(2)}</span>`;
function draw(){let s=D.stocks.filter(r=>f=="all"||(f=="any"?r.match.length:r.match.includes(f)));
s.sort((a,b)=>{let x=a[k],y=b[k];return (x>y?1:x<y?-1:0)*(asc?1:-1)});
tb.innerHTML=s.map(r=>`<tr class="${r.match.length?"hit":""}"><td>${r.code}</td><td>${r.name}</td><td>${(r.mcap_yi||0).toLocaleString()}</td><td>${r.close??"—"}</td><td>${c(r.chg1)}</td><td>${c(r.chg5)}</td><td>${r.match.map(m=>`<span class=tag>${m}</span>`).join("")}</td></tr>`).join("")||"<tr><td colspan=7>無符合股票</td></tr>"}
fetch("data.json?"+Date.now()).then(r=>r.json()).then(d=>{D=d;const a=d.stocks.filter(r=>r.match.includes("當日±5%")).length,b=d.stocks.filter(r=>r.match.includes("5日±10%")).length;
meta.textContent=`最後更新：${d.updated}｜收盤資料日期：${d.trade_date}｜共 ${d.stocks.length} 檔｜當日>±5%：${a} 檔｜5日>±10%：${b} 檔`;draw()});
document.querySelectorAll(".btns button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".btns button").forEach(x=>x.classList.remove("on"));b.classList.add("on");f=b.dataset.f;draw()});
document.querySelectorAll("th[data-k]").forEach(t=>t.onclick=()=>{asc=k==t.dataset.k?!asc:false;k=t.dataset.k;draw()});
</script></body></html>
